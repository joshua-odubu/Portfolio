<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Styled FAQ</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }

    details {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 10px 15px;
      margin-bottom: 10px;
      transition: all 0.3s ease;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    summary {
      font-weight: bold;
      cursor: pointer;
      list-style: none;
      outline: none;
      position: relative;
      padding-left: 20px;
    }

    summary::before {
      content: '➕';
      position: absolute;
      left: 0;
      transition: transform 0.2s ease;
    }

    details[open] summary::before {
      content: '➖';
    }

    details p {
      margin: 10px 0 0 0;
    }
  </style>
</head>
<body>

  <h2>❓ FAQ</h2>

  <details>
    <summary>What is ChatGPT?</summary>
    <p>ChatGPT is a language model developed by OpenAI that can assist with writing, coding, and answering questions.</p>
  </details>

  <details>
    <summary>Can I style HTML elements?</summary>
    <p>Yes! You can use CSS to customize how elements look and behave.</p>
  </details>

</body>
</html>
