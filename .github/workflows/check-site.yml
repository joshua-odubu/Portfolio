name: Check site

# Validates the HTML and checks every link on each push and pull request,
# plus once a week to catch external links that have gone dead.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  html:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes html-validate@8.24.1 *.html writing/*.html

  links:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # LinkedIn blocks automated requests (HTTP 999), so it is skipped.
          args: >-
            --root-dir "${{ github.workspace }}"
            --exclude "linkedin\.com"
            --accept "200..=299,403,429"
            --max-retries 3
            --no-progress
            "./**/*.html"
          fail: true
